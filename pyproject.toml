[project]
name = "strands-decider-rpg"
version = "0.1.0"
description = "Once Upon Agentic AI replayed with the Strands Decider 2B: its confidence picks the ending."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
# The real decision model plus its CLI and server. Heavy (pulls torch + transformers), and only
# the server needs it: the game and the tests talk to it over HTTP. The serve command in the
# README installs it on first use with `uv run --extra decider`.
decider = ["strands-decider==0.1.0"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "mypy>=2.4"]

[project.scripts]
once-upon-strands-decider = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat src/: the modules sit straight in src/ and install as top-level modules.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
